name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and packages
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -q
          sudo apt-get install -y -q flex bison bc libelf-dev libssl-dev e2fsprogs cpio

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Cache guest artifacts
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: guest/out
          key: guest-${{ hashFiles('scripts/build-guest.sh', 'guest/kernel.config', 'guest/rcS', 'guest/inittab', 'guest/initramfs-init', 'guest/vsock-test.c') }}

      - name: Build guest artifacts
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-guest.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Set up host networking
        run: sudo ./scripts/setup-tap.sh tap0 "$USER"

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: |
          set -o pipefail
          cargo test --release --no-fail-fast -- --nocapture --test-threads=1 2>&1 | tee target/test-output.log
          cargo test --release -p minivmm --target x86_64-unknown-linux-musl --lib 2>&1 | tee -a target/test-output.log

      - name: Show guest logs
        if: always()
        run: |
          for log in target/tmp/guest-logs/*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Test summary
        if: always()
        run: |
          grep -aE '^test .* \.\.\. |^test result|^failures:|^    [a-z_]+$|^(clone memory|restore latency)' target/test-output.log || true
          grep -a -A6 'panicked at' target/test-output.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-logs
          path: target/tmp/guest-logs
          if-no-files-found: ignore

  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and packages
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -q
          sudo apt-get install -y -q flex bison bc libelf-dev libssl-dev e2fsprogs cpio debootstrap

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Describe the runner
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|Virtualization'
          free -m
          uname -r

      - name: Restore guest artifacts
        id: guest-cache
        uses: actions/cache/restore@v4
        with:
          path: guest/out
          key: guest-${{ hashFiles('scripts/build-guest.sh', 'guest/kernel.config', 'guest/rcS', 'guest/inittab', 'guest/initramfs-init', 'guest/vsock-test.c') }}

      - name: Build guest artifacts
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-guest.sh

      - name: Save guest artifacts
        if: steps.guest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: guest/out
          key: ${{ steps.guest-cache.outputs.cache-primary-key }}

      - name: Restore the python base image
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: guest/build/runtimes/python-base.tar
          key: python-base-${{ hashFiles('scripts/build-runtimes.sh') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: platform-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build static binaries
        run: cargo build --release --target x86_64-unknown-linux-musl -p minivmm -p mv-agent -p mv-example-native

      - name: Build runtime images
        run: |
          if [ -f guest/build/runtimes/python-base.tar ]; then
            sudo mkdir -p guest/build/runtimes
            sudo tar -C guest/build/runtimes -xf guest/build/runtimes/python-base.tar
          fi
          sudo AGENT=target/x86_64-unknown-linux-musl/release/mv-agent ./scripts/build-runtimes.sh
          if [ ! -f guest/build/runtimes/python-base.tar ]; then
            sudo tar -C guest/build/runtimes -cf guest/build/runtimes/python-base.tar python-base
          fi
          sudo chown -R "$USER" guest/build/runtimes/python-base.tar

      - name: Save the python base image
        if: steps.python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: guest/build/runtimes/python-base.tar
          key: ${{ steps.python-cache.outputs.cache-primary-key }}

      - name: Build platform tests
        run: |
          cargo build --release -p mvd -p mvctl
          cargo test --release -p mvd --no-run --message-format=json > target/test-artifacts.json
          for test in platform benchmark; do
            jq -r "select(.reason == \"compiler-artifact\" and .target.name == \"$test\" and .executable != null) | .executable" \
              target/test-artifacts.json > "target/$test-test-binary"
          done
          cat target/*-test-binary

      - name: End-to-end platform tests
        run: |
          set -o pipefail
          sudo "$(cat target/platform-test-binary)" --nocapture --test-threads=1 2>&1 | tee target/platform-output.log

      - name: Benchmarks
        run: |
          set -o pipefail
          sudo "$(cat target/benchmark-test-binary)" --ignored --nocapture --test-threads=1 2>&1 | tee target/benchmark-output.log
          grep -a 'BENCH' target/benchmark-output.log

      - name: Show mvd logs
        if: failure()
        run: |
          for log in target/tmp/mvd-logs/*.log; do
            echo "::group::$log"
            sudo tail -n 300 "$log"
            echo "::endgroup::"
          done

      - name: Platform test summary
        if: always()
        run: |
          grep -a -A12 'panicked at' target/platform-output.log || true
          grep -aE '^test .* \.\.\. |^test result|^failures:|^    [a-z_]+$|took|cold|load:|clock' target/platform-output.log || true
          sudo grep -ahE 'cannot start a VM|WARN|ERROR' target/tmp/mvd-logs/*.log | grep -v 'deploy failed' | tail -n 40 || true

      - name: Benchmark summary
        if: always()
        run: |
          sudo grep -ahE 'VMM spawned|connected to the agent|agent synchronized|VMM status after restore' target/tmp/mvd-logs/bench.log | head -n 16 || true
          grep -a 'BENCH' target/benchmark-output.log || true

      - name: Remove root-owned test state
        if: always()
        run: sudo rm -rf target/tmp/platform target/tmp/platform-base target/tmp/mvd-logs

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check the deployment configuration
        working-directory: deploy
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked

      - name: Fuzz each target briefly
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done
