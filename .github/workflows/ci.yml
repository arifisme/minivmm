name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and packages
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          sudo apt-get update -q
          sudo apt-get install -y -q flex bison bc libelf-dev libssl-dev e2fsprogs cpio

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Cache guest artifacts
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: guest/out
          key: guest-${{ hashFiles('scripts/build-guest.sh', 'guest/kernel.config', 'guest/rcS', 'guest/inittab', 'guest/initramfs-init') }}

      - name: Build guest artifacts
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-guest.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Set up host networking
        run: sudo ./scripts/setup-tap.sh tap0 "$USER"

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: |
          set -o pipefail
          cargo test --release --no-fail-fast -- --nocapture --test-threads=1 2>&1 | tee target/test-output.log

      - name: Show guest logs
        if: always()
        run: |
          for log in target/tmp/guest-logs/*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Test summary
        if: always()
        run: grep -aE '^test .* \.\.\. |panicked at|^test result|^failures:|^    [a-z_]+$' target/test-output.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-logs
          path: target/tmp/guest-logs
          if-no-files-found: ignore
