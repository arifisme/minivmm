[package]
name = "mvd"
version = "0.1.0"
edition = "2024"
description = "Serverless function platform daemon built on minivmm"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
libc = "0.2"
mv-proto = { path = "../mv-proto" }
prometheus = { version = "0.14", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
