[package]
name = "mvctl"
version = "0.1.0"
edition = "2024"
description = "Command-line client for the mvd serverless platform"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
humantime = "2"
mv-proto = { path = "../mv-proto" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
