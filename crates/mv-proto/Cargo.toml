[package]
name = "mv-proto"
version = "0.1.0"
edition = "2024"
description = "Messages shared by the minivmm platform daemon, CLI and guest agent"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
