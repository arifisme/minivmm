[package]
name = "mv-agent"
version = "0.1.0"
edition = "2024"
description = "Guest agent that runs functions inside minivmm microVMs"
license = "MIT"

[dependencies]
flate2 = "1"
libc = "0.2"
mv-proto = { path = "../mv-proto" }
serde_json = { version = "1", features = ["raw_value"] }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
flate2 = "1"
serde_json = "1"
tar = { version = "0.4", default-features = false }
tempfile = "3"
